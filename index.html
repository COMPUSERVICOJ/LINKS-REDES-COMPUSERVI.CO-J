<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMPUSERVI.CO J - Soluciones Tecnologicas</title>
  
  <!-- Icono de la pestaña (Favicon) -->
  <link rel="icon" type="image/png" href="https://i.postimg.cc/J7x8FNxr/LOGO-CS-BLANCO.png">
  <link rel="apple-touch-icon" href="https://i.postimg.cc/J7x8FNxr/LOGO-CS-BLANCO.png">

  <style>
    :root {
      --bg-color: #030712;
      --card-bg: rgba(17, 24, 39, 0.7);
      --border-color: rgba(56, 189, 248, 0.3);
      --accent-glow: rgba(56, 189, 248, 0.15);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
    }

    body {
      background-color: var(--bg-color);
      /* Fondo con rejilla sutil de estilo tecnológico */
      background-image: 
        radial-gradient(circle at 50% 0%, var(--accent-glow) 0%, transparent 50%),
        linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 50px 20px;
    }

    .profile-container {
      position: relative;
      margin-bottom: 20px;
    }

    .profile-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin: 0 0 8px 0;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
      text-align: center;
    }

    /* Estilo para el lema compacto */
    .tagline {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      margin: 0 0 35px 0;
      line-height: 1.4;
    }

    .tagline span {
      display: block;
    }

    .links-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-card {
      background-color: var(--card-bg);
      backdrop-filter: blur(10px);
      color: var(--text-main);
      text-decoration: none;
      padding: 18px 24px;
      border-radius: 14px;
      text-align: center;
      font-weight: 600;
      font-size: 0.95rem;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Efecto de brillo futurista al pasar el mouse */
    .link-card:hover {
      background-color: rgba(56, 189, 248, 0.1);
      border-color: var(--primary);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
      transform: translateY(-3px);
    }
  </style>
</head>
<body>

  <!-- Foto de perfil -->
  <div class="profile-container">
    <img class="profile-img" src="https://i.postimg.cc/J7x8FNxr/LOGO-CS-BLANCO.png" alt="Foto de perfil">
  </div>
  
  <!-- Título principal -->
  <h1>COMPUSERVI.CO J</h1>

  <!-- Lema / Subtítulo organizado -->
  <div class="tagline">
    <span>Soluciones Tecnológicas</span>
    <span>Servicio Técnico Especializado</span>
  </div>

  <!-- Lista de Enlaces -->
  <div class="links-container">
    
    <!-- WhatsApp (Sin el signo +) -->
    <a href="https://wa.me/573227133114" class="link-card" target="_blank" rel="noopener">
      💬 WhatsApp Directo
    </a>

    <!-- TikTok -->
    <a href="https://www.tiktok.com/@compuservi.co.j" class="link-card" target="_blank" rel="noopener">
      🎵 TikTok
    </a>

    <!-- Instagram -->
    <a href="https://www.instagram.com/compuservi.coj/" class="link-card" target="_blank" rel="noopener">
      📸 Instagram
    </a>

    <!-- Facebook -->
    <a href="https://www.facebook.com/profile.php?id=100064021154075" class="link-card" target="_blank" rel="noopener">
      📘 Facebook
    </a>

  </div>

</body>
</html>
