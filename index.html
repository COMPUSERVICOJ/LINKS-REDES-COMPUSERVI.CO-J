<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Enlaces</title>
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
    }
    .profile-img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 16px;
      border: 3px solid #38bdf8;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 8px 0;
    }
    p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin: 0 0 32px 0;
    }
    .links-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .link-card {
      background-color: #1e293b;
      color: #ffffff;
      text-decoration: none;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      font-weight: 600;
      border: 1px solid #334155;
      transition: all 0.2s ease;
    }
    .link-card:hover {
      background-color: #38bdf8;
      color: #0f172a;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Foto de perfil: Reemplaza la URL entre comillas por tu propia foto o avatar -->
  <img class="profile-img" src="https://via.placeholder.com/150" alt="Foto de perfil">
  
  <!-- Tu Nombre y Biografía -->
  <h1>COMPUSERVI.CO J</h1>
  <p>Bienvenido a mis enlaces oficiales</p>

  <!-- Lista de Enlaces (Reemplaza las URLs y los nombres) -->
  <div class="links-container">
    
    <a href="https://wa.me/+573227133114" class="link-card" target="_blank" rel="noopener">
      💬 WhatsApp
    </a>

    <a href="https://www.tiktok.com/@compuservi.co.j" class="link-card" target="_blank" rel="noopener">
      🎵 TikTok
    </a>

    <a href="https://www.tiktok.com/@compuservi.co.j" class="link-card" target="_blank" rel="noopener">
      📸 Instagram
    </a>

    <a href="https://www.facebook.com/profile.php?id=100064021154075" target="_blank" rel="noopener">
      📲 Facebook
    </a>

  </div>

</body>
</html>
